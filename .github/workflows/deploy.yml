# main 브랜치에 올라오면 웹사이트에 필요한 파일만 골라 GitHub Pages로 배포한다.
# 참고자료/ · MD/ · sql/ 등 강사용 파일은 웹사이트에 올라가지 않는다 (저장소에는 그대로 남음).
# 처음 한 번: 저장소 Settings → Pages → Source를 "GitHub Actions"로 선택.
# 웹사이트에 보여야 하는 새 폴더·파일을 만들면 아래 "웹사이트 파일 모으기"의 목록에 추가한다.
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: 웹사이트 파일 모으기
        run: |
          mkdir _site
          cp -r index.html css js img html _site/
      - uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        id: upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      # Use the upload output directly: artifact listing can omit an artifact that exists.
      - name: Deploy uploaded Pages artifact
        id: deployment
        uses: actions/github-script@v8
        env:
          PAGES_ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        with:
          script: |
            const artifactId = Number(process.env.PAGES_ARTIFACT_ID);
            if (!Number.isSafeInteger(artifactId) || artifactId <= 0) {
              throw new Error('Upload step did not return a valid Pages artifact ID.');
            }
            const repo = { owner: context.repo.owner, repo: context.repo.repo };
            const oidcToken = await core.getIDToken();
            core.setSecret(oidcToken);
            const { data: deployment } = await github.request('POST /repos/{owner}/{repo}/pages/deployments', {
              ...repo,
              artifact_id: artifactId,
              pages_build_version: context.sha,
              oidc_token: oidcToken
            });
            const deploymentId = deployment.id || deployment.status_url?.split('/').pop();
            if (!deploymentId) throw new Error('GitHub did not return a Pages deployment ID.');
            if (deployment.page_url) core.setOutput('page_url', deployment.page_url);
            core.info('Created Pages deployment ' + deploymentId + ' from artifact ' + artifactId);
            const failedStatuses = new Set(['deployment_failed', 'deployment_content_failed', 'deployment_cancelled', 'deployment_lost']);
            const deadline = Date.now() + 600000;
            let requestFailures = 0;
            while (Date.now() < deadline) {
              await new Promise(resolve => setTimeout(resolve, 5000));
              let status;
              try {
                ({ data: status } = await github.request('GET /repos/{owner}/{repo}/pages/deployments/{deployment_id}', {
                  ...repo, deployment_id: deploymentId
                }));
                requestFailures = 0;
              } catch (error) {
                requestFailures += 1;
                core.warning('Pages status request failed (' + requestFailures + '/3).');
                if (requestFailures < 3) continue;
                break;
              }
              core.info('Pages deployment status: ' + status.status);
              if (status.status === 'succeed') {
                core.setOutput('status', 'succeed');
                return;
              }
              if (failedStatuses.has(status.status)) throw new Error('Pages deployment failed: ' + status.status);
            }
            try {
              await github.request('POST /repos/{owner}/{repo}/pages/deployments/{deployment_id}/cancel', {
                ...repo, deployment_id: deploymentId
              });
            } catch (error) {
              core.warning('Could not cancel the incomplete Pages deployment.');
            }
            throw new Error('Pages deployment did not complete within the allowed time.');
